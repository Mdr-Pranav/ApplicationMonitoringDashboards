apiVersion: 1

deleteDatasources:
  - name: PostgreSQL
    orgId: 1

datasources:
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    user: $POSTGRES_USER
    database: $POSTGRES_DB
    isDefault: true
    jsonData:
      sslmode: "disable"
      maxOpenConns: 100
      maxIdleConns: 100
      connMaxLifetime: 14400
      postgresVersion: 1400
    secureJsonData:
      password: $POSTGRES_PASSWORD
    version: 1
    editable: false
